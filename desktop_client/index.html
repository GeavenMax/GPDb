<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>GPDb</title>
    <script>
      /*
       * Paints the stored theme before Vue mounts. theme.css keys every theme off
       * `data-theme` on <html>, and the bundle that would set it loads after the first
       * paint — without this, a light theme starts dark and snaps a frame later.
       *
       * Must stay in sync with src/utils/theme.ts (same keys, same resolution, same
       * DEFAULT_STYLE fallback); this copy exists only because it cannot import.
       *
       * The two-key migration below mirrors migrateLegacyPrefs() in
       * src/utils/prefs.ts, which carries every preference over from its GPDb+ name.
       * These two have to happen *here* rather than there: doing them after the bundle
       * loads would paint the frame this script exists to get right.
       */
      (function () {
        try {
          [['gpdb_theme', 'gpdb_theme'], ['gpdb_theme_style', 'gpdb_theme_style']].forEach(function (pair) {
            if (localStorage.getItem(pair[0]) === null) {
              var previous = localStorage.getItem(pair[1]);
              if (previous !== null) localStorage.setItem(pair[0], previous);
            }
            localStorage.removeItem(pair[1]);
          });
        } catch (e) {
          /* storage blocked: fall through to the defaults below */
        }
        var choice = localStorage.getItem('gpdb_theme') || 'auto';
        var style, scheme;
        if (choice === 'auto') {
          style = localStorage.getItem('gpdb_theme_style') || 'glass';
          scheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          var parts = choice.split('-');
          style = parts[0];
          scheme = parts[1];
        }
        document.documentElement.setAttribute('data-theme', style + '-' + scheme);
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-accent-fill/30 selection:text-accent-soft">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
