[package]
name = "gpdb-core"
version = "2.5.0"
edition = "2021"
rust-version = "1.77.2"
description = "GPDb 查询层：只依赖 rusqlite 与 serde，不依赖 Tauri"

# 这个 crate 是 path 依赖，不进 workspace 的发布物。它的存在本身就是约束：
# 这里没有 tauri 依赖，所以 queries/ 里不可能 `use tauri::*` —— 边界由 Cargo 的
# 依赖图强制成立，而不是靠约定。
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
