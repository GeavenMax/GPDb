[package]
name = "gevi-plus"
version = "0.1.0"
description = "GEVI+ — 离线影视库桌面端"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Cargo 包名不允许 `+`，所以这里是 gevi-plus；显示名走 tauri.conf.json 的
# productName (GEVI+) 与 mainBinaryName (gevi-plus)。
[lib]
name = "gevi_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
