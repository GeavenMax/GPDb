# gevi-core 是 workspace 成员而不是普通 path 依赖：这样两者共用 src-tauri/target，
# `cargo test -p gevi-core` 不必从零再编译一遍 rusqlite。
[workspace]
members = ["gevi-core"]

[package]
name = "gevi-plus"
version = "0.1.0"
description = "GEVI+ — 离线影视库桌面端"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Cargo 包名不允许 `+`，所以这里是 gevi-plus；显示名走 tauri.conf.json 的
# productName (GEVI+) 与 mainBinaryName (gevi-plus)。
[lib]
name = "gevi_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# 查询层。它自己不依赖 tauri —— 见 gevi-core/src/lib.rs。
gevi-core = { path = "gevi-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
