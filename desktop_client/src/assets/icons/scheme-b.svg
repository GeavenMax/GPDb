<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS squircle clip -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Base Obsidian Gradients -->
    <linearGradient id="obsidianBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="40%" stop-color="#12141c" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>

    <!-- Subtle Bevel Border -->
    <linearGradient id="bevelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>

    <!-- Projector Beam Gradient -->
    <linearGradient id="projectorBeam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#cbd5e1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0" />
    </linearGradient>

    <!-- Refracted Rainbow Spectrum (Subdued Cinema Grade) -->
    <linearGradient id="refractedRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#f43f5e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glass Prism Gradient -->
    <linearGradient id="prismGlass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Matte Titanium Cutout G Gradient -->
    <linearGradient id="letterG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="prismGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softDiffusion" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Base Canvas -->
    <rect width="512" height="512" fill="url(#obsidianBase)" />

    <!-- 35mm Film Sprockets along the left side -->
    <g fill="#07080c" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5">
      <rect x="22" y="45" width="20" height="28" rx="5" />
      <rect x="22" y="105" width="20" height="28" rx="5" />
      <rect x="22" y="165" width="20" height="28" rx="5" />
      <rect x="22" y="225" width="20" height="28" rx="5" />
      <rect x="22" y="285" width="20" height="28" rx="5" />
      <rect x="22" y="345" width="20" height="28" rx="5" />
      <rect x="22" y="405" width="20" height="28" rx="5" />
      <rect x="22" y="465" width="20" height="28" rx="5" />
    </g>
    <!-- Film Track Divider Line -->
    <line x1="56" y1="0" x2="56" y2="512" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4" />

    <!-- Projector Ambient Light Beam (Top Left to Center) -->
    <polygon points="60,0 140,0 270,225 210,225" fill="url(#projectorBeam)" />

    <!-- Diffuse Rainbow Glow behind the Emblem -->
    <ellipse cx="290" cy="275" rx="140" ry="110" fill="url(#refractedRainbow)" opacity="0.35" filter="url(#softDiffusion)" />

    <!-- Refraction Fan Rays -->
    <g opacity="0.4" filter="url(#prismGlow)">
      <polygon points="230,225 460,200 480,240 240,240" fill="#38bdf8" />
      <polygon points="235,235 480,250 495,295 245,255" fill="#818cf8" />
      <polygon points="240,245 490,305 480,355 248,270" fill="#c084fc" />
      <polygon points="242,260 470,365 440,415 245,280" fill="#f43f5e" />
      <polygon points="238,275 425,425 385,465 235,290" fill="#f59e0b" />
    </g>

    <!-- Crystalline Triangular Prism (Precision Geometry) -->
    <polygon points="230,170 270,250 190,250" fill="url(#prismGlass)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" />
    <polygon points="230,170 270,250 250,265" fill="#ffffff" fill-opacity="0.18" />

    <!-- Main Emblem: Sculptural "G" Vault Monogram -->
    <g transform="translate(230, 275)">
      <!-- Drop Shadow on G -->
      <path d="M 0 -85 A 85 85 0 0 0 -85 0 A 85 85 0 0 0 0 85 A 85 85 0 0 0 65 30 L 15 30 A 45 45 0 0 1 0 45 A 45 45 0 0 1 -45 0 A 45 45 0 0 1 0 -45 A 45 45 0 0 1 45 -12 L 72 -38 A 85 85 0 0 0 0 -85 Z" fill="#000000" opacity="0.5" transform="translate(0, 10)" filter="url(#prismGlow)" />
      
      <!-- Cutout Letter G Body -->
      <path d="M 0 -85 A 85 85 0 0 0 -85 0 A 85 85 0 0 0 0 85 A 85 85 0 0 0 65 30 L 15 30 A 45 45 0 0 1 0 45 A 45 45 0 0 1 -45 0 A 45 45 0 0 1 0 -45 A 45 45 0 0 1 45 -12 L 72 -38 A 85 85 0 0 0 0 -85 Z" fill="url(#letterG)" stroke="url(#refractedRainbow)" stroke-width="2.5" />
      
      <!-- Inner Horizontal Bar of G -->
      <rect x="0" y="-8" width="55" height="16" rx="4" fill="url(#letterG)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
      
      <!-- Central Gem Reflection on G Crossbar -->
      <circle cx="20" cy="0" r="4.5" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Top Gloss Highlight on Squircle Rim -->
    <rect x="1" y="1" width="510" height="510" rx="114" ry="114" fill="none" stroke="url(#bevelBorder)" stroke-width="2.5" />
  </g>
</svg>
