<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS squircle clip -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Dark Matte Alloy Titanium Chassis -->
    <linearGradient id="alloyChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920" />
      <stop offset="50%" stop-color="#0f1015" />
      <stop offset="100%" stop-color="#07070a" />
    </linearGradient>

    <!-- Aperture Blade Metallic Gradients -->
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c38" />
      <stop offset="100%" stop-color="#14151b" />
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333645" />
      <stop offset="100%" stop-color="#181922" />
    </linearGradient>

    <!-- Flowing Neon Plasma (Core G Channel) -->
    <linearGradient id="plasmaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glass Cap Highlight for G -->
    <linearGradient id="glassCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Rim Light Gradient -->
    <linearGradient id="rimD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.4" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Base Chassis -->
    <rect width="512" height="512" fill="url(#alloyChassis)" />

    <!-- Viewfinder Reticle / Camera Guides -->
    <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5">
      <!-- Outer Dial Ring -->
      <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="4 8" />
      <circle cx="256" cy="256" r="165" fill="none" />
      <!-- Registration Crosshairs -->
      <line x1="256" y1="26" x2="256" y2="42" />
      <line x1="256" y1="470" x2="256" y2="486" />
      <line x1="26" y1="256" x2="42" y2="256" />
      <line x1="470" y1="256" x2="486" y2="256" />
    </g>

    <!-- 8 MECHANICAL CAMERA APERTURE BLADES (Rotated around 256, 256) -->
    <g transform="translate(256, 256)">
      <!-- Blade 1 (0 deg) -->
      <path d="M 0 -165 L 125 -110 C 145 -70, 150 -30, 130 30 L 70 0 Z" fill="url(#bladeGrad1)" stroke="#090a0e" stroke-width="2" />
      <!-- Blade 2 (45 deg) -->
      <path d="M 0 -165 L 125 -110 C 145 -70, 150 -30, 130 30 L 70 0 Z" fill="url(#bladeGrad2)" stroke="#090a0e" stroke-width="2" transform="rotate(45)" />
      <!-- Blade 3 (90 deg) -->
      <path d="M 0 -165 L 125 -110 C 145 -70, 150 -30, 130 30 L 70 0 Z" fill="url(#bladeGrad1)" stroke="#090a0e" stroke-width="2" transform="rotate(90)" />
      <!-- Blade 4 (135 deg) -->
      <path d="M 0 -165 L 125 -110 C 145 -70, 150 -30, 130 30 L 70 0 Z" fill="url(#bladeGrad2)" stroke="#090a0e" stroke-width="2" transform="rotate(135)" />
      <!-- Blade 5 (180 deg) -->
      <path d="M 0 -165 L 125 -110 C 145 -70, 150 -30, 130 30 L 70 0 Z" fill="url(#bladeGrad1)" stroke="#090a0e" stroke-width="2" transform="rotate(180)" />
      <!-- Blade 6 (225 deg) -->
      <path d="M 0 -165 L 125 -110 C 145 -70, 150 -30, 130 30 L 70 0 Z" fill="url(#bladeGrad2)" stroke="#090a0e" stroke-width="2" transform="rotate(225)" />
      <!-- Blade 7 (270 deg) -->
      <path d="M 0 -165 L 125 -110 C 145 -70, 150 -30, 130 30 L 70 0 Z" fill="url(#bladeGrad1)" stroke="#090a0e" stroke-width="2" transform="rotate(270)" />
      <!-- Blade 8 (315 deg) -->
      <path d="M 0 -165 L 125 -110 C 145 -70, 150 -30, 130 30 L 70 0 Z" fill="url(#bladeGrad2)" stroke="#090a0e" stroke-width="2" transform="rotate(315)" />
      
      <!-- Central Aperture Well (Dark iris opening) -->
      <circle cx="0" cy="0" r="102" fill="#08080c" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2" />
    </g>

    <!-- AMBIENT NEON REFLECTION IN IRIS WELL -->
    <circle cx="256" cy="256" r="75" fill="url(#plasmaGlow)" opacity="0.25" filter="url(#neonBloom)" />

    <!-- FLOWING NEON LETTER "G" GLYPH -->
    <g transform="translate(256, 256)" filter="url(#neonBloom)">
      <!-- Outer Glow Track -->
      <path d="
        M 50 -55
        A 76 76 0 1 0 55 52
        L 55 0
        L 0 0
      " fill="none" stroke="url(#plasmaGlow)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

      <!-- High-Intensity Inner Core Conduit -->
      <path d="
        M 50 -55
        A 76 76 0 1 0 55 52
        L 55 0
        L 0 0
      " fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

      <!-- Terminal Hotspots -->
      <circle cx="50" cy="-55" r="5" fill="#fef08a" />
      <circle cx="0" cy="0" r="5" fill="#fef08a" />
    </g>

    <!-- Lens Specular Glint -->
    <ellipse cx="210" cy="180" rx="35" ry="15" fill="#ffffff" opacity="0.1" transform="rotate(-30 210 180)" />

    <!-- Outer Squircle Bevel Rim -->
    <rect x="1" y="1" width="510" height="510" rx="114" ry="114" fill="none" stroke="url(#rimD)" stroke-width="2.5" />
  </g>
</svg>
