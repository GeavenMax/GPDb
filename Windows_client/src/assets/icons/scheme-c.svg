<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS squircle clip -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>

    <!-- Deep Noir Canvas Gradient -->
    <linearGradient id="noirBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="60%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Cyber Cyan Chiaroscuro (Key Light on Left) -->
    <linearGradient id="cyanKeyLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Cinema Magenta & Amber (Rim Light on Right) -->
    <linearGradient id="magentaRimLight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </linearGradient>

    <!-- Torso Marble Texture Tone -->
    <linearGradient id="marbleTorso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39" />
      <stop offset="50%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>

    <!-- Anamorphic Lens Flare Beam -->
    <linearGradient id="anamorphicStreak" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Base Darkroom -->
    <rect width="512" height="512" fill="url(#noirBase)" />

    <!-- 35mm Film Gate Framing Border -->
    <rect x="36" y="36" width="440" height="440" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
    <!-- Film Corner Marks -->
    <path d="M 36 68 L 68 68 L 68 36" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />
    <path d="M 476 68 L 444 68 L 444 36" fill="none" stroke="#ec4899" stroke-opacity="0.4" stroke-width="2" />
    <path d="M 36 444 L 68 444 L 68 476" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />
    <path d="M 476 444 L 444 444 L 444 476" fill="none" stroke="#ec4899" stroke-opacity="0.4" stroke-width="2" />

    <!-- Background Cinema Ambient Flares -->
    <circle cx="160" cy="200" r="140" fill="#0284c7" opacity="0.12" filter="url(#softGlow)" />
    <circle cx="350" cy="260" r="130" fill="#9333ea" opacity="0.1" filter="url(#softGlow)" />

    <!-- MALE TORSO SILHOUETTE & ANATOMICAL PLANES (Classical Statue Chiaroscuro) -->
    <g transform="translate(136, 90)">
      <!-- Main Muscular Torso Body Form -->
      <path d="
        M 120 20
        C 105 18, 70 30, 40 55
        C 25 70, 15 95, 20 125
        C 25 155, 45 180, 52 210
        C 58 235, 52 265, 55 295
        C 58 315, 68 335, 75 345
        L 165 345
        C 172 335, 182 315, 185 295
        C 188 265, 182 235, 188 210
        C 195 180, 215 155, 220 125
        C 225 95, 215 70, 200 55
        C 170 30, 135 18, 120 20 Z
      " fill="url(#marbleTorso)" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />

      <!-- LEFT SIDE KEY LIGHT (Chiaroscuro Cyan Edge Modeling) -->
      <!-- Shoulder & Left Lat Contour -->
      <path d="
        M 120 20
        C 105 18, 70 30, 40 55
        C 25 70, 15 95, 20 125
        C 25 155, 45 180, 52 210
        C 58 235, 52 265, 55 295
        C 58 315, 68 335, 75 345
      " fill="none" stroke="url(#cyanKeyLight)" stroke-width="9" stroke-linecap="round" filter="url(#softGlow)" />

      <!-- Pectoral Muscles (Chest Plates) -->
      <!-- Left Pec Line -->
      <path d="M 120 65 C 105 68, 65 72, 45 92 C 40 108, 48 135, 75 142 C 100 148, 118 145, 120 145" fill="none" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="4.5" stroke-linecap="round" />
      <!-- Right Pec Line (in warm shadow) -->
      <path d="M 120 65 C 135 68, 175 72, 195 92 C 200 108, 192 135, 165 142 C 140 148, 122 145, 120 145" fill="none" stroke="#ec4899" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
      <!-- Sternal Centerline (Cleavage) -->
      <line x1="120" y1="55" x2="120" y2="160" stroke="#000000" stroke-width="4" stroke-linecap="round" />

      <!-- Abdominal Core (Six-Pack & Linea Alba) -->
      <!-- Linea Alba (Abdomen Center Division) -->
      <path d="M 120 160 L 120 330" stroke="#0a0a0d" stroke-width="5" stroke-linecap="round" />
      <path d="M 120 160 L 120 330" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />

      <!-- Upper Ab Pair -->
      <path d="M 90 185 C 100 183, 115 183, 120 183" fill="none" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 120 183 C 125 183, 140 183, 150 185" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" />

      <!-- Mid Ab Pair -->
      <path d="M 86 225 C 100 223, 115 223, 120 223" fill="none" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 120 223 C 125 223, 140 223, 154 225" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" />

      <!-- Lower Ab Pair (Navel region) -->
      <path d="M 88 268 C 100 265, 115 265, 120 265" fill="none" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 120 265 C 125 265, 140 265, 152 268" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" />

      <!-- Navel Accent -->
      <ellipse cx="120" cy="272" rx="2.5" ry="4" fill="#000000" />
      <path d="M 118 274 A 3 3 0 0 0 122 274" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />

      <!-- Apollo's Belt (Iliac Crest / V-Line) -->
      <path d="M 68 305 C 85 320, 110 335, 120 338" fill="none" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 172 305 C 155 320, 130 335, 120 338" fill="none" stroke="#ec4899" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" />

      <!-- RIGHT SIDE RIM LIGHT (Magenta & Violet Contour) -->
      <path d="
        M 120 20
        C 135 18, 170 30, 200 55
        C 215 70, 225 95, 220 125
        C 215 155, 195 180, 188 210
        C 182 235, 188 265, 185 295
        C 182 315, 172 335, 165 345
      " fill="none" stroke="url(#magentaRimLight)" stroke-width="7" stroke-linecap="round" filter="url(#softGlow)" />
    </g>

    <!-- Horizontal Anamorphic Cinema Flare across the Chest -->
    <rect x="0" y="210" width="512" height="4" fill="url(#anamorphicStreak)" filter="url(#softGlow)" />
    <circle cx="256" cy="212" r="5" fill="#ffffff" opacity="0.9" />

    <!-- Top Rim Border -->
    <rect x="1" y="1" width="510" height="510" rx="114" ry="114" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" />
  </g>
</svg>
