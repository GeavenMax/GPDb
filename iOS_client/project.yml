name: GPDb
options:
  bundleIdPrefix: com.gpdb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "2.16.1"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 7.12.0
targets:
  GPDb:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GPDb
    dependencies:
      - package: GRDB
      - package: ZIPFoundation
      - package: Kingfisher
    info:
      path: GPDb/Info.plist
      properties:
        CFBundleDisplayName: "GPDb"
        NSFaceIDUsageDescription: "GPDb 需要使用 Face ID 保护并解锁私有本地影库"
        NSPhotoLibraryAddUsageDescription: "GPDb 需要将流光分享卡片保存至您的系统相册"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpdb.ios
        DEVELOPMENT_TEAM: U95LQ6T7VN
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

