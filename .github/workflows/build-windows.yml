name: Build & Release Windows Client (x64)

# 触发条件：
#   1. 推送 v* 格式的 Tag（如 v2.6.0）→ 自动编译并发布至 GitHub Release
#   2. workflow_dispatch → 在 GitHub Actions 页面手动触发构建并提供下载
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布 Tag 名（仅手动触发时用，如 v2.6.0）'
        required: false
        default: 'manual-build'

jobs:
  build-windows:
    name: Build Windows NSIS Installer & MSI (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 安装 Rust 工具链 ──────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      # ── 3. 缓存 Cargo 依赖与构建中间件 ──────────────────────────────────────
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop_client/src-tauri

      # ── 4. 安装 Node.js ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop_client/package-lock.json

      # ── 5. 安装前端依赖 ───────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: desktop_client
        run: npm ci

      # ── 6. 构建 Tauri Windows 客户端 (NSIS 安装程序 & MSI 包) ────────────────
      - name: Build Tauri app for Windows
        working-directory: desktop_client
        run: npm run tauri build -- --bundles nsis,msi

      # ── 7. 定位并整理 Windows 构建产物 ────────────────────────────────────────
      - name: Locate Windows Bundle Artifacts
        id: artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or "${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v2.6.0"
          }

          $nsisFiles = Get-ChildItem -Path "desktop_client/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsisFiles) {
            $exePath = $nsisFiles[0].FullName
            $targetExe = "GPDb-Windows-x64-$tag-Setup.exe"
            Copy-Item $exePath -Destination $targetExe
            Write-Host "✅ NSIS installer ready: $targetExe"
            echo "exe_path=$targetExe" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::warning::No NSIS .exe installer found in output directory."
          }

          $msiFiles = Get-ChildItem -Path "desktop_client/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if ($msiFiles) {
            $msiPath = $msiFiles[0].FullName
            $targetMsi = "GPDb-Windows-x64-$tag.msi"
            Copy-Item $msiPath -Destination $targetMsi
            Write-Host "✅ MSI package ready: $targetMsi"
            echo "msi_path=$targetMsi" >> $env:GITHUB_OUTPUT
          }

          echo "tag_name=$tag" >> $env:GITHUB_OUTPUT

      # ── 8. 上传 Windows 安装包为 Actions Artifact ────────────────────────────
      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: GPDb-Windows-x64-${{ steps.artifacts.outputs.tag_name }}
          path: |
            ${{ steps.artifacts.outputs.exe_path }}
            ${{ steps.artifacts.outputs.msi_path }}
          if-no-files-found: error
          retention-days: 30

      # ── 9. 发布至 GitHub Release（Tag 推送触发时执行）────────────────────────
      - name: Attach Windows binaries to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "GPDb ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            ${{ steps.artifacts.outputs.exe_path }}
            ${{ steps.artifacts.outputs.msi_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
