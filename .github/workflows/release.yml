name: Build & Release GPDb (macOS & Windows)

# 触发条件：
#   1. 推送 v* 格式的 Tag（如 v2.7.0）→ 自动编译并发布 GitHub Release
#   2. workflow_dispatch → 在 GitHub Actions 页面手动触发，用于测试构建
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布 Tag 名（仅手动触发时用，如 v2.7.0）'
        required: false
        default: 'manual-build'

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            bundles: app,dmg
          - platform: Windows
            os: windows-latest
            bundles: nsis

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 安装 Rust 工具链 ───────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── 3. 缓存 Cargo 依赖 ──────────────────────────────────────────────────
      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop_client/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop_client/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── 4. 安装 Node.js ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop_client/package-lock.json

      # ── 5. 安装前端依赖 ───────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: desktop_client
        run: npm ci

      # ── 6. 构建 Tauri 应用 ─────────────────────────────────────────────────
      - name: Build Tauri app
        working-directory: desktop_client
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # ── 7. 整理产物并按规范重命名 ─────────────────────────────────────────
      - name: Prepare build artifacts
        id: artifacts
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          fi

          mkdir -p dist_release

          if [ "${{ runner.os }}" == "macOS" ]; then
            DMG_PATH=$(find desktop_client/src-tauri/target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
            if [ -n "$DMG_PATH" ]; then
              NEW_NAME="GPDb-macOS-${TAG_NAME}.dmg"
              cp "$DMG_PATH" "dist_release/$NEW_NAME"
              echo "✅ macOS package: dist_release/$NEW_NAME"
            fi
            APK_PATH=$(find android_client -name "GPDb_Android_${TAG_NAME}_release_signed.apk" 2>/dev/null | head -1)
            if [ -n "$APK_PATH" ]; then
              NEW_APK_NAME="GPDb-Android-${TAG_NAME}-signed.apk"
              cp "$APK_PATH" "dist_release/$NEW_APK_NAME"
              echo "✅ Android APK package: dist_release/$NEW_APK_NAME"
            fi
          elif [ "${{ runner.os }}" == "Windows" ]; then
            SETUP_PATH=$(find desktop_client/src-tauri/target/release/bundle/nsis -name "*.exe" 2>/dev/null | head -1)
            if [ -n "$SETUP_PATH" ]; then
              NEW_NAME="GPDb-Windows-${TAG_NAME}.exe"
              cp "$SETUP_PATH" "dist_release/$NEW_NAME"
              echo "✅ Windows package: dist_release/$NEW_NAME"
            fi
          fi

          ls -la dist_release

      # ── 8. 发布 / 附加到 GitHub Release ─────────────────────────────────────
      - name: Upload to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "GPDb ${{ github.ref_name }}"
          body: |
            ## GPDb ${{ github.ref_name }}

            > 详细更新日志见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ### 📦 安装说明

            ####  macOS (Universal - Apple Silicon & Intel)
            1. 下载下方附件 `GPDb-macOS-${{ github.ref_name }}.dmg`
            2. 双击挂载，将 `GPDb.app` 拖入 `Applications` 文件夹
            3. **首次启动提示未公证**：在「系统设置 → 隐私与安全性」点击「仍要打开」，或终端运行：`sudo xattr -cr /Applications/GPDb.app`

            #### 🪟 Windows (x64)
            1. 下载下方附件 `GPDb-Windows-${{ github.ref_name }}.exe` (或 `.msi`)
            2. 双击运行安装程序完成安装

            #### 🤖 Android (Mobile - Kotlin / Compose)
            1. 下载下方附件 `GPDb-Android-${{ github.ref_name }}-signed.apk`
            2. 在 Android 手机双击安装包完成安装（如提示允许未知来源安装，请予以允许）

            ---
            *Built with Tauri 2 · Vue 3 · Rust · Kotlin (Jetpack Compose)*
          draft: false
          prerelease: false
          files: dist_release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
